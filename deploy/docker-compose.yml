# Pull-only stack — no git clone, no local build on the Pi.
# Defaults: Docker Hub (publish from Mac with deploy/publish-dockerhub.sh).

x-docker-env: &docker-env
  DJ_API_INTERNAL_URL: http://api:8000
  DJ_DATABASE_URL: sqlite:////data/dj_library.db
  DJ_WATCH_FOLDER: /data/watch
  DJ_INCOMING_FOLDER: /data/incoming
  DJ_PROCESSING_FOLDER: /data/processing
  DJ_READY_FOLDER: /data/ready
  DJ_REVIEW_FOLDER: /data/review
  DJ_DUPLICATES_FOLDER: /data/duplicates
  DJ_ARCHIVE_FOLDER: /data/archive
  DJ_FAILED_FOLDER: /data/failed
  DJ_LOGS_FOLDER: /data/logs
  DJ_REKORDBOX_EXPORT_FOLDER: /data/rekordbox

x-backend: &backend
  image: ${DOCKER_USER:?Set DOCKER_USER in .env to your Docker Hub ID}/dj-pipeline-backend:latest
  env_file: .env
  environment: *docker-env
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      db-init:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: python -m app.workers.main
    cpus: "1.0"
    mem_limit: 1g
    depends_on:
      api:
        condition: service_started

  watcher:
    <<: *backend
    command: python -m app.workers.watcher
    cpus: "0.5"
    mem_limit: 256m
    depends_on:
      api:
        condition: service_started

  scheduler:
    <<: *backend
    command: python -m app.workers.scheduler
    cpus: "0.25"
    mem_limit: 128m
    depends_on:
      api:
        condition: service_started

  frontend:
    image: ${DOCKER_USER:?Set DOCKER_USER in .env}/dj-pipeline-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  db-init:
    <<: *backend
    command: python -m app.db.init_db
    restart: "no"
